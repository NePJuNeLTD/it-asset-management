<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<title>Import Excel</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    width:500px;
}

input{
    width:100%;
    margin-top:20px;
}

button{
    margin-top:20px;
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
}

</style>

</head>

<body>

<form
    method="POST"
    enctype="multipart/form-data"
    class="card"
>

    <h1>
        📁 Import Excel
    </h1>

    <input
        type="file"
        name="excel_file"
        accept=".xlsx,.xls"
        required
    >

    <button type="submit">
        🚀 Import
    </button>

</form>

</body>

</html>
