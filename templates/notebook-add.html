<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Notebook</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Kanit',sans-serif;

            background:
            radial-gradient(circle at top left,#2563eb22,transparent 25%),
            radial-gradient(circle at bottom right,#1d4ed822,transparent 25%),
            linear-gradient(135deg,#020617,#0f172a,#1e293b);

            color:white;

            min-height:100vh;

            padding:40px 20px;

            overflow-x:hidden;
        }

        .container{

            max-width:950px;

            margin:auto;
        }

        /* HEADER */

        .topbar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;

            flex-wrap:wrap;

            gap:18px;
        }

        .title{

            font-size:44px;

            font-weight:700;

            letter-spacing:1px;

            line-height:1.1;
        }

        .title span{

            color:#60a5fa;
        }

        .subtitle{

            color:#94a3b8;

            margin-top:10px;

            font-size:15px;
        }

        /* BUTTON */

        .btn{

            padding:13px 22px;

            border-radius:16px;

            text-decoration:none;

            font-weight:600;

            color:white;

            transition:.25s;

            border:1px solid rgba(255,255,255,0.08);

            display:inline-flex;

            align-items:center;

            justify-content:center;

            gap:8px;

            backdrop-filter:blur(10px);
        }

        .btn:hover{

            transform:translateY(-2px);
        }

        .back-btn{

            background:#334155;
        }

        .back-btn:hover{

            background:#475569;

            box-shadow:
            0 10px 25px rgba(71,85,105,.35);
        }

        /* CARD */

        .box{

            position:relative;

            overflow:hidden;

            background:rgba(30,41,59,0.92);

            backdrop-filter:blur(16px);

            border:1px solid rgba(255,255,255,0.08);

            padding:38px;

            border-radius:32px;

            box-shadow:
            0 20px 50px rgba(0,0,0,0.45);
        }

        .box::before{

            content:'';

            position:absolute;

            width:300px;

            height:300px;

            background:#2563eb22;

            border-radius:50%;

            top:-120px;

            right:-120px;

            filter:blur(20px);
        }

        .box::after{

            content:'';

            position:absolute;

            width:220px;

            height:220px;

            background:#3b82f622;

            border-radius:50%;

            bottom:-100px;

            left:-100px;

            filter:blur(20px);
        }

        /* SECTION */

        .section-title{

            font-size:18px;

            font-weight:600;

            margin-bottom:18px;

            color:#e2e8f0;

            display:flex;

            align-items:center;

            gap:10px;
        }

        .divider{

            height:1px;

            background:rgba(255,255,255,0.08);

            margin:30px 0;
        }

        /* FORM */

        .grid{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:20px;

            position:relative;

            z-index:2;
        }

        .full{

            grid-column:1 / -1;
        }

        .input-group{

            display:flex;

            flex-direction:column;

            gap:8px;
        }

        label{

            font-size:14px;

            color:#cbd5e1;

            font-weight:500;
        }

        input,
        select,
        textarea{

            width:100%;

            border:none;

            border-radius:16px;

            background:#0f172a;

            color:white;

            padding:15px 18px;

            outline:none;

            font-size:15px;

            border:1px solid rgba(255,255,255,0.08);

            transition:.2s;
        }

        textarea{

            min-height:110px;

            resize:vertical;
        }

        input:focus,
        select:focus,
        textarea:focus{

            border:1px solid #60a5fa;

            box-shadow:
            0 0 0 4px rgba(96,165,250,0.12);
        }

        input::placeholder,
        textarea::placeholder{

            color:#64748b;
        }

        /* SAVE BUTTON */

        .save-btn{

            width:100%;

            height:60px;

            border:none;

            border-radius:18px;

            margin-top:35px;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color:white;

            font-size:18px;

            font-weight:700;

            cursor:pointer;

            transition:.25s;

            position:relative;

            z-index:2;
        }

        .save-btn:hover{

            transform:translateY(-2px);

            box-shadow:
            0 15px 35px rgba(37,99,235,0.45);
        }

        /* INFO BOX */

        .info-box{

            margin-top:25px;

            background:rgba(15,23,42,0.9);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:20px;

            padding:18px;

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

            gap:18px;
        }

        .info-item{

            display:flex;

            flex-direction:column;

            gap:5px;
        }

        .info-item span{

            color:#94a3b8;

            font-size:13px;
        }

        .info-item strong{

            color:white;

            font-size:15px;
        }

        /* MOBILE */

        @media(max-width:768px){

            .grid{

                grid-template-columns:1fr;
            }

            .title{

                font-size:34px;
            }

            .topbar{

                flex-direction:column;

                align-items:flex-start;
            }

            .box{

                padding:25px;
            }

            .btn{

                width:100%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="topbar">

        <div>

            <div class="title">
                ➕ ADD <span>NOTEBOOK</span>
            </div>

            <div class="subtitle">
                เพิ่มข้อมูล Notebook / PC / Printer เข้าสู่ระบบ Asset Management
            </div>

        </div>

        <a href="/notebooks"
           class="btn back-btn">

            ← กลับรายการอุปกรณ์

        </a>

    </div>

    <!-- FORM -->

    <div class="box">

        <form method="POST">

            <!-- BASIC -->

            <div class="section-title">
                💻 ข้อมูลอุปกรณ์
            </div>

            <div class="grid">

                <div class="input-group">

                    <label>ประเภทอุปกรณ์</label>

                    <select name="device_type">

                        <option value="Notebook">
                            Notebook
                        </option>

                        <option value="PC">
                            PC Desktop
                        </option>

                        <option value="Printer">
                            Printer
                        </option>

                        <option value="Network">
                            Network Device
                        </option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Asset Code</label>

                    <input
                        type="text"
                        name="asset_code"
                        placeholder="เช่น NB-001"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Brand</label>

                    <input
                        type="text"
                        name="brand"
                        placeholder="เช่น Dell / HP / Lenovo"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Model</label>

                    <input
                        type="text"
                        name="model"
                        placeholder="เช่น Latitude 5420"
                        required
                    >

                </div>

            </div>

            <div class="divider"></div>

            <!-- SPEC -->

            <div class="section-title">
                ⚙️ สเปกเครื่อง
            </div>

            <div class="grid">

                <div class="input-group">

                    <label>CPU</label>

                    <input
                        type="text"
                        name="cpu"
                        placeholder="Intel Core i7"
                    >

                </div>

                <div class="input-group">

                    <label>RAM</label>

                    <input
                        type="text"
                        name="ram"
                        placeholder="16GB DDR4"
                    >

                </div>

                <div class="input-group">

                    <label>Storage</label>

                    <input
                        type="text"
                        name="storage"
                        placeholder="512GB SSD"
                    >

                </div>

                <div class="input-group">

                    <label>Operating System</label>

                    <input
                        type="text"
                        name="os"
                        placeholder="Windows 11 Pro"
                    >

                </div>

            </div>

            <div class="divider"></div>

            <!-- DETAIL -->

            <div class="section-title">
                📦 รายละเอียดเพิ่มเติม
            </div>

            <div class="grid">

                <div class="input-group full">

                    <label>Serial Number</label>

                    <input
                        type="text"
                        name="serial_number"
                        placeholder="Serial Number"
                    >

                </div>

                <div class="input-group">

                    <label>Purchase Date</label>

                    <input
                        type="date"
                        name="purchase_date"
                    >

                </div>

                <div class="input-group">

                    <label>Warranty Expire</label>

                    <input
                        type="date"
                        name="warranty_expire"
                    >

                </div>

                <div class="input-group">

                    <label>Purchase Price</label>

                    <input
                        type="number"
                        step="0.01"
                        name="price"
                        placeholder="เช่น 35000"
                    >

                </div>

                <div class="input-group">

                    <label>Status</label>

                    <select name="status">

                        <option value="available">
                            Available
                        </option>

                        <option value="in_use">
                            In Use
                        </option>

                        <option value="repair">
                            Repair
                        </option>

                    </select>

                </div>

                <div class="input-group full">

                    <label>หมายเหตุ</label>

                    <textarea
                        name="note"
                        placeholder="รายละเอียดเพิ่มเติม เช่น ใช้งานฝ่ายบัญชี / มี Docking / มีจอเพิ่ม"
                    ></textarea>

                </div>

            </div>

            <!-- INFO -->

            <div class="info-box">

                <div class="info-item">

                    <span>รองรับอุปกรณ์</span>

                    <strong>
                        Notebook / PC / Printer
                    </strong>

                </div>

                <div class="info-item">

                    <span>ระบบติดตาม</span>

                    <strong>
                        Asset Management
                    </strong>

                </div>

                <div class="info-item">

                    <span>สถานะ</span>

                    <strong>
                        Available / In Use / Repair
                    </strong>

                </div>

            </div>

            <button
                type="submit"
                class="save-btn"
            >

                💾 SAVE DEVICE

            </button>

        </form>

    </div>

</div>

</body>

</html>
